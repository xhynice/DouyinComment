name: Daily Crawler

on:
  schedule:
    - cron: '0 16 * * *'  # 北京时间 00:00 (UTC+8)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create cookie file from secret
      run: |
        echo "${{ secrets.COOKIE_TXT }}" | base64 -d > cookie.txt
        mkdir -p scripts
        cp cookie.txt scripts/cookie.txt
    
    - name: Load historical data for dedup
      run: |
        git fetch origin crawler-data || true
        if git rev-parse --verify origin/crawler-data >/dev/null 2>&1; then
          DATA_WT=/tmp/crawler-data-dedup
          rm -rf "$DATA_WT"
          git worktree add "$DATA_WT" crawler-data 2>/dev/null || true
          if [ -d "$DATA_WT/data" ]; then
            echo "加载历史数据用于去重..."
            rsync -a "$DATA_WT/data/" data/
            echo "历史数据加载完成，共 $(find data/ -name '*.csv' | wc -l) 个 CSV 文件"
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove "$DATA_WT" --force 2>/dev/null || true
        else
          echo "crawler-data 分支不存在，跳过历史数据加载"
        fi

    - name: Run crawler
      run: python main.py --all --limit 10
    
    - name: Touch database files
      run: |
        find data/ -name "sqlite.db" -exec touch {} \; 2>/dev/null || true
        echo "Updated database file timestamps"
    
    - name: Migrate to bucket (direct mode)
      run: python scripts/migrate_to_bucket.py --direct --author all
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    - name: Migrate to bucket (API mode)
      run: python scripts/migrate_to_bucket.py --author all
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    - name: Upload data artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crawler-data-${{ github.run_number }}
        path: |
          data/
          logs/
        retention-days: 3
    
    - name: Commit data to data branch
      continue-on-error: true
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git fetch origin crawler-data || true

        # 用 worktree 在单独目录操作 crawler-data 分支，避免覆盖工作区的 data/
        DATA_WT=/tmp/crawler-data-wt
        rm -rf "$DATA_WT"
        if git rev-parse --verify origin/crawler-data >/dev/null 2>&1; then
          git worktree add "$DATA_WT" crawler-data
        else
          git worktree add --orphan "$DATA_WT" crawler-data
          rm -rf "$DATA_WT"/* "$DATA_WT"/.* 2>/dev/null || true
        fi

        # 同步采集数据到 worktree
        mkdir -p "$DATA_WT/data/"
        rsync -a data/ "$DATA_WT/data/"
        mkdir -p "$DATA_WT/logs/"
        rsync -a logs/ "$DATA_WT/logs/"

        cd "$DATA_WT"
        git add -f data/ logs/ 2>/dev/null || true
        if git diff --staged --quiet; then
          echo "无数据变化，跳过提交"
        else
          git commit -m "Auto crawl: $(date '+%Y-%m-%d %H:%M') [skip ci]"
          git push origin crawler-data
        fi

        # 清理 worktree
        cd "$GITHUB_WORKSPACE"
        git worktree remove "$DATA_WT" --force 2>/dev/null || true
