# ==================== 基础配置 ====================
# 数据保存目录（相对 config.yaml 所在目录，支持绝对路径）
# 用户数据 → {data_dir}/{sec_uid}/ 下的 csv / sqlite.db / avatar.jpg
# 全局 DB  → {data_dir}/database/sqlite.db
data_dir: data


# ==================== 用户配置 ====================
# 支持多用户批量采集，每个用户数据独立存储
users:
  - enabled: true
    sec_uid: "MS4wLjABAAAA2FYVN1jBWaTVasx7wXcsK0rCPfSYixt5-J1pUegQIbA"      # 用户 ID（从主页 URL 获取）
    nickname: "张全蛋。"                                                         # 用户昵称（用于日志显示，便于识别）

  - enabled: true
    sec_uid: "MS4wLjABAAAAWKIRK91nF8hLjuza0KVRL50-lcfNlEPHocsF9hNYzCUag7n4BgIHQaERsfq_NiHR"
    nickname: "才扁扁"

  - enabled: true
    sec_uid: "MS4wLjABAAAAcalmoSBh0fW1GKS97yeuGpQ83ebQ_0rdmY8M5I5xN_c"
    nickname: "张君雅1v4⁸⁰⁰⁸"

  - enabled: true
    sec_uid: "MS4wLjABAAAA7lF03Wj8aIqkH9FvFJ-TTMEfGsmCoGRNX45Zj5hvLQNQR0CVTFbc3AMNl4Ar0tal"
    nickname: "小睡神"


# ==================== 存储配置 ====================
# SQLite 用于去重和加速查询，CSV 用于 Excel 直接打开
sqlite: true


# ==================== 采集配置 ====================
crawler:
  request_delay: 1                                                              # 请求间隔（秒），自动加 30% 随机抖动，推荐 1.0-2.0，过快可能触发风控
  download_threads: 6                                                            # 媒体下载并发线程数，推荐 4-8，过多可能被限流


# ==================== 日志配置 ====================
log:
  console_level: INFO                                                           # 控制台日志级别：DEBUG | INFO | WARNING | ERROR
  file_level: DEBUG                                                             # 文件日志级别（建议始终 DEBUG，保留详细信息）


# ==================== 字段配置 ====================
# 控制各类数据保存哪些字段到 CSV
# 值为 true = 保存该字段，false = 不保存
fields:
  # 作品字段
  video:
    aweme_id: true                 # 作品 ID
    desc: true                     # 作品描述
    create_time: true              # 创建时间（时间戳）
    images: true                   # 图片列表（多个 URL）
    video: true                    # 视频地址
    thumb: true                    # 缩略图

  # 评论字段
  comment:
    aweme_id: true                 # 作品 ID
    cid: true                      # 评论 ID
    text: true                     # 评论内容
    image_list: true               # 评论图片列表
    digg_count: true               # 点赞数
    create_time: true              # 创建时间（时间戳）
    user_nickname: true            # 用户昵称
    user_unique_id: true           # 用户 ID
    user_avatar: true              # 用户头像 URL
    sticker: true                  # 表情包 URL
    reply_comment_total: true      # 回复数量
    ip_label: true                 # IP 归属地

  # 回复字段
  reply:
    aweme_id: true                 # 作品 ID
    cid: true                      # 评论 ID
    reply_id: true                 # 回复 ID
    reply_to_reply_id: true        # 回复的回复 ID
    text: true                     # 回复内容
    image_list: true               # 回复图片列表
    digg_count: true               # 点赞数
    create_time: true              # 创建时间（时间戳）
    user_nickname: true            # 用户昵称
    user_unique_id: true           # 用户 ID
    user_avatar: true              # 用户头像 URL
    sticker: true                  # 表情包 URL
    reply_to_username: true        # 回复的目标用户名
    ip_label: true                 # IP 归属地


# ==================== 媒体下载配置 ====================
# 控制各类媒体文件是否下载（仅 --download-only 时生效）
media_download:
  # 作品相关媒体
  video:
    images: true                   # 作品图片
    videos: true                   # 作品视频
    thumbs: true                   # 作品缩略图

  # 评论相关媒体
  comment:
    images: true                   # 评论图片
    avatars: true                  # 用户头像
    stickers: true                 # 表情包

  # 回复相关媒体
  reply:
    images: true                   # 回复图片
    avatars: true                  # 用户头像
    stickers: true                 # 表情包
